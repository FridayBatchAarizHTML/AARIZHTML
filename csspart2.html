<html>
    <head>
        <style>
            .para1 {
                font-family: "Times New Roman", serif;
                font-style: italic;
                font-size: 12px;
                font-weight: 200;
            }
            .para2 {
                font-family: Arial, sans-serif;
                font-style: Bold;
                font-size: 30px;
                  font-weight: 600;
            }
            .para3 {
                font-family: "Courier New", monospace;
                font-style: Underline;
                font-size: 12px;
                  font-weight: bold;
            }
        </style>
    </head>
    <body>
        <p class="para1">Times New Roman font.</p>
        <p class="para2">Arial font.</p>
        <p class="para3">Courier New font.</p>
    </body>
</html>
